# 人工登錄｜財報看不出來的兩項紅旗
#
# 規格第十六節列的 16 項紅旗中，有 14 項可由財報數字客觀判定，系統已自動偵測。
# 剩下這兩項無法從財報推導：
#
#   · governance             公司治理重大問題
#   · competitive_share_loss 競爭對手市占率快速增加
#
# 硬用財報數字去近似它們，只會產生「看起來很客觀、實際上沒有根據」的判斷。
# 因此系統的預設行為是把它們標示為「未檢查」——明說沒查，而不是假裝查過沒問題。
#
# 當你從重大訊息、法說會或產業報告發現問題時，登錄在這裡即可觸發紅旗。
#
# 資料來源建議：
#   · 公開資訊觀測站重大訊息 https://mops.twse.com.tw
#   · 公司法說會簡報與年報
#   · 產業市占調查（TrendForce、IDC、Counterpoint 等）
#
# 每筆登錄需填 note（具體事由）與 reported_on（你查證到的日期）。

issues: {}
# 範例格式（取消註解並替換）：
# issues:
#   "1234":
#     governance:
#       note: "2026-07 重大訊息：獨立董事集體請辭，公司未說明原因"
#       reported_on: 2026-07-22
#     competitive_share_loss:
#       note: "主要競爭對手在其核心產品線市占自 18% 升至 31%（TrendForce 2026Q2）"
#       reported_on: 2026-08-05
