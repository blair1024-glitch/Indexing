name: 全市場掃描

# 兩段式全市場掃描，找出 BUY 候選。
#
# 第一階段用彙總報表評估全部約 1,975 家的企業品質——不發出任何逐檔請求，
# 所以不花 FinMind 額度。第二階段只對品質最高的前 N 名補齊估值。
#
# 第一階段要跑近兩千家，比每日更新久得多，因此 timeout 拉長。
on:
  workflow_dispatch:
    inputs:
      top_n:
        description: 第二階段補齊估值的檔數（留空則用設定檔的 50）
        required: false

concurrency:
  # 同一檔連按兩次不需要跑兩遍；不同檔可以並行。
  group: screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安裝相依套件
        run: python -m pip install --quiet -e ".[dev]"

      # 只還原不儲存：每日更新那邊會維護快取，這裡蹭現成的就好。
      # 沒命中也只是慢一點（要重抓十年份彙總報表），不會失敗。
      - name: 還原財報歷史快取
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: mops-history-
          restore-keys: |
            mops-history-

      - name: 全市場掃描
        id: screen
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set -o pipefail
          ARGS=""
          if [ -n "${{ inputs.top_n }}" ]; then ARGS="--top ${{ inputs.top_n }}"; fi
          python -m buffett00929.cli screen $ARGS 2>&1 | tee analyse.log

      # 摘要直接放進 job summary，不必點進 log 翻。
      - name: 寫入執行摘要
        if: always()
        run: |
          {
            echo "## 全市場掃描"
            echo
            echo '```'
            cat analyse.log 2>/dev/null || echo "（分析未產生輸出）"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit 報表
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 分析期間分支可能已被推了新的 commit（每日更新會寫產出物）。
          # 直接 push 會被拒，整份結果就白算了。把 HEAD 對齊遠端再重新 commit：
          # --soft 只移動 HEAD，工作目錄裡剛產生的檔案原封不動。
          # 理由與 daily-update.yml 相同，那裡有完整說明。
          BRANCH="${{ github.ref_name }}"
          git fetch origin "$BRANCH"
          git reset "origin/$BRANCH"
          git add reports/screen.md

          if git diff --cached --quiet; then
            echo "報表沒有變化，不建立 commit。"
            exit 0
          fi

          git commit -m "chore: 全市場掃描"

          for attempt in 1 2 3 4; do
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "push 失敗，第 $attempt 次重試"
            sleep $((2 ** attempt))
            git fetch origin "$BRANCH"
            git reset "origin/$BRANCH"
            git add reports/screen.md
            git commit -m "chore: 全市場掃描"
          done
          exit 1
