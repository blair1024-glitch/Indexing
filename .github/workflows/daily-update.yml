name: Daily 00929 update

# 規格第十三節：每天檢查成分股是否公布月營收／季報／年報／重大訊息。
#
# 台股月營收於每月 10 日前公布、季報於各季結束後 45 天內公布，
# 都在台灣時間白天。此處排在台灣時間 18:30（UTC 10:30），
# 讓當日公布的資料都已進入證交所的 OpenAPI。
on:
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:
    inputs:
      reason:
        description: 手動執行的原因（會記錄在 commit 訊息）
        required: false
        default: 手動觸發

concurrency:
  # 同時只跑一個更新，避免兩次執行同時寫快照造成 commit 衝突。
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # 完整歷史：commit 前要 fetch 遠端分支並把 HEAD 對齊過去（見下方），
          # 淺層 clone 會讓那一步失敗。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安裝相依套件
        run: python -m pip install --quiet -e ".[dev]"

      # 十年份的 MOPS 彙總報表約 110 MB，太大不適合進版控，
      # 但每天重抓近百次 1.5 MB 的頁面既慢又對來源端不禮貌。
      # 已定案的期別在快取層是永久有效的（見 sources/cache.py），
      # 所以還原快取後只會抓新增的期別。
      #
      # 刻意拆成 restore / save 兩段：用單一 actions/cache 時，
      # 儲存發生在 post 階段，**job 失敗就整個跳過**——
      # 曾經因為最後的 commit 步驟失敗，把已經抓好的十年歷史全部作廢。
      # 抓到的資料與後續步驟成敗無關，所以 save 用 if: always()。
      - name: 還原財報歷史快取
        id: history-cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: mops-history-${{ github.run_id }}
          restore-keys: |
            mops-history-

      - name: 驗證設定與指標實作一致
        run: make check

      - name: 執行測試
        run: make test

      - name: 更新分析
        id: update
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set -o pipefail
          make update 2>&1 | tee update.log

      # 分析本身已經跑完，抓到的歷史不該因為後面的步驟失敗而丟掉。
      - name: 保存財報歷史快取
        if: always() && steps.history-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: mops-history-${{ github.run_id }}

      - name: Commit 結果
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 分析要跑十分鐘以上，這段期間分支很可能已經被推了新的 commit。
          # 直接 push 會被拒（non-fast-forward），整份結果就白算了。
          #
          # 把 HEAD 與索引都對齊遠端（--mixed，即預設），再重新 stage 產出物。
          #
          # **這裡不能用 --soft。** --soft 只移動 HEAD，索引仍停留在 checkout
          # 當下那個舊 commit 的樹；任何在執行期間被推上遠端的**新檔案**在那個
          # 索引裡並不存在，於是下一個 commit 會把它記錄成「刪除」。
          # 實際發生過兩次：一次刪掉了整個全市場掃描功能（screen.py、
          # test_screen.py、screen.yml 共 370 行），一次刪掉了剛加的測試。
          # 兩次都沒有任何錯誤訊息——分析照跑、commit 照推、檔案就是不見了。
          #
          # --mixed 讓索引等於遠端，工作目錄裡剛產生的檔案原封不動；
          # 接著只 stage 產出物路徑，其餘檔案維持遠端的內容。
          # 產出物每次執行都是整份重新生成，「最後一次執行說了算」正是正確語意。
          git fetch origin "$BRANCH"
          git reset "origin/$BRANCH"
          git add data/snapshots docs reports

          if git diff --cached --quiet; then
            echo "本次執行沒有任何變化，不建立 commit。"
            exit 0
          fi

          # 把當日的評分變化寫進 commit 訊息，git log 本身就是變化歷史。
          {
            echo "chore: 00929 每日更新 $(date -u +%Y-%m-%d)"
            echo
            if grep -q "評分變化" update.log; then
              sed -n '/📈 評分變化/,/^$/p' update.log | tail -n +2
            fi
            if grep -q "🚨 紅旗" update.log; then
              sed -n '/🚨 紅旗/,/^$/p' update.log | tail -n +2
            fi
          } > commit-message.txt

          git commit -F commit-message.txt

          # 上面的對齊只在 commit 當下成立；若正好有另一次推送插進來，
          # 重新對齊後再試。產出物是整份重生的，重做這一步沒有副作用。
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "推送被拒（第 ${attempt} 次），重新對齊遠端後再試。"
            sleep $((attempt * 3))
            git fetch origin "$BRANCH"
            git reset "origin/$BRANCH"
            git add data/snapshots docs reports
            if git diff --cached --quiet; then
              echo "重新對齊後已無差異（另一次執行寫入了相同結果）。"
              exit 0
            fi
            git commit -F commit-message.txt
          done

          echo "::error::連續 3 次推送都被拒，請檢查是否有其他流程在寫同一個分支。"
          exit 1

      - name: 保留執行紀錄
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-log
          path: update.log
          retention-days: 14

      - name: 失敗時說明
        if: failure()
        run: |
          echo "::warning::更新失敗。常見原因："
          echo "::warning::1. 成分股名單來源無法連線 —— 系統會中止而不使用過期名單，這是預期行為"
          echo "::warning::2. FINMIND_TOKEN 未設定或額度用盡 —— 長期指標會標示資料不足"
          echo "::warning::3. 資料來源 schema 變動 —— 執行 make verify 可列出實際欄位名稱"
