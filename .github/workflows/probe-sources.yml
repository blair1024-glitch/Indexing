name: Probe constituent sources

# 一次性診斷用。只能手動觸發，不排程、不寫入任何檔案。
#
# 目的：在網路可通的環境實際探測 00929 成分股名單的可用來源。
# 開發環境連不上台股任何來源，這個 workflow 是唯一能取得真實回應的途徑。
on:
  workflow_dispatch:
    inputs:
      target:
        description: 要探測哪個來源
        type: choice
        options: [mops, constituents, tpex-valuation, all]
        default: mops

jobs:
  probe:
    runs-on: ubuntu-latest
    # 只讀不寫：這個 workflow 不應該有能力改動 repo。
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # MOPS 探測直接跑正式解析器，所以要把套件裝起來。
      - name: 安裝探測相依套件
        run: python -m pip install --quiet -e "." playwright

      # 只有需要側錄瀏覽器流量的探測才裝 chromium（裝一次約一分鐘）。
      - name: 安裝 chromium
        if: inputs.target == 'constituents' || inputs.target == 'all'
        run: python -m playwright install --with-deps chromium

      - name: 探測成分股來源
        if: inputs.target == 'constituents' || inputs.target == 'all'
        run: python scripts/probe_constituent_sources.py

      - name: 探測 MOPS 歷史財報
        if: inputs.target == 'mops' || inputs.target == 'all'
        run: python scripts/probe_mops.py

      # 上櫃公司的本益比／淨值比／殖利率目前無來源：證交所有 valuation
      # 端點，櫃買沒有對應設定。先查清楚有沒有，再決定要不要接。
      - name: 探測櫃買估值指標端點
        if: inputs.target == 'tpex-valuation' || inputs.target == 'all'
        run: python scripts/probe_tpex_valuation.py
