name: 個股查詢

# 對任意上市櫃股號跑一次巴菲特分析。
#
# 與每日更新走同一條流程、同一套門檻——差別只在「選誰」：
# 這裡不查 00929 持股名單，直接用你輸入的股號。
# MOPS 彙總報表本來就是全市場的（約 1,975 家），所以非成分股
# 拿到的資料品質與成分股相同。
on:
  workflow_dispatch:
    inputs:
      stock_id:
        description: 股票代號（例如 2330）
        required: true

concurrency:
  # 同一檔連按兩次不需要跑兩遍；不同檔可以並行。
  group: analyse-stock-${{ inputs.stock_id }}
  cancel-in-progress: true

jobs:
  analyse:
    runs-on: ubuntu-latest
    # 不設就吃 GitHub 預設的 6 小時。這條流程幾乎所有時間都花在 MOPS，
    # 而 MOPS 慢起來是沒有上限的：十年歷史共 90 次請求，實測單次 1.7–15.9 秒，
    # 任一次不順還會以 max_retries: 3 + timeout_seconds: 90 重試，
    # 單一個請求最多吃掉 4 分 44 秒。
    #
    # 2026-10-07 有一次查詢跑到 45 分鐘還沒結束（正常是 8–9 分），
    # 當天不砍它就會燒掉六小時額度。45 分鐘留給「快取沒命中、要重抓十年」
    # 這個最慢的合法情況（約 25 分）加上一點重試餘裕。
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安裝相依套件
        run: python -m pip install --quiet -e ".[dev]"

      # 快取與每日更新共用同一個 mops-history- 前綴；restore-keys 的前綴比對
      # 會挑到**最新建立**的那一份，所以誰先跑都拿得到最新的歷史。
      #
      # 這裡以前是「只還原不儲存」，想蹭每日更新維護好的快取。實際上不夠：
      # 每日更新排在台灣時間 18:30，白天查幾檔就付幾次全額重抓的代價
      # ——而且辛苦抓回來的十年歷史跑完就隨 runner 消失，下一檔從頭再來。
      # 既然已經抓了，就存起來給當天後續的查詢用。
      #
      # key 必須是唯一值（帶 run_id）。若用 mops-history- 這種固定字串當
      # primary key，第二次儲存會因為「Cache already exists」而失敗。
      - name: 還原財報歷史快取
        id: history-cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: mops-history-${{ github.run_id }}
          restore-keys: |
            mops-history-

      - name: 分析個股
        id: analyse
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set -o pipefail
          python -m buffett00929.cli analyse "${{ inputs.stock_id }}" 2>&1 | tee analyse.log

      # 抓到的歷史與後續步驟成敗無關，所以用 if: always()——
      # 即使分析中途失敗或被 timeout 砍掉，已經抓到的期別也要留下來，
      # 下一次查詢才不必從零開始。理由同 daily-update.yml 的拆分說明。
      - name: 保存財報歷史快取
        if: always() && steps.history-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: mops-history-${{ github.run_id }}

      # 摘要直接放進 job summary，不必點進 log 翻。
      - name: 寫入執行摘要
        if: always()
        run: |
          {
            echo "## 個股查詢：${{ inputs.stock_id }}"
            echo
            echo '```'
            cat analyse.log 2>/dev/null || echo "（分析未產生輸出）"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit 報表
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 分析期間分支可能已被推了新的 commit（每日更新會寫產出物）。
          # 直接 push 會被拒，整份結果就白算了。把 HEAD 對齊遠端再重新 commit：
          # 用 --mixed（git reset 的預設）：索引一併對齊遠端，工作目錄裡
          # 剛產生的檔案原封不動。**不可改成 --soft**——那會讓索引停在
          # checkout 當下的舊樹，把執行期間被推上遠端的新檔案記成刪除。
          # 完整理由與兩次實際損失記在 daily-update.yml。
          BRANCH="${{ github.ref_name }}"
          git fetch origin "$BRANCH"
          git reset "origin/$BRANCH"
          git add reports/lookup docs/lookup

          if git diff --cached --quiet; then
            echo "報表沒有變化，不建立 commit。"
            exit 0
          fi

          git commit -m "chore: 個股查詢 ${{ inputs.stock_id }}"

          for attempt in 1 2 3 4; do
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "push 失敗，第 $attempt 次重試"
            sleep $((2 ** attempt))
            git fetch origin "$BRANCH"
            git reset "origin/$BRANCH"
            git add reports/lookup docs/lookup
            git commit -m "chore: 個股查詢 ${{ inputs.stock_id }}"
          done
          exit 1
