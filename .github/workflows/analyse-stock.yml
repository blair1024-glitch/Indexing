name: 個股查詢

# 對任意上市櫃股號跑一次巴菲特分析。
#
# 與每日更新走同一條流程、同一套門檻——差別只在「選誰」：
# 這裡不查 00929 持股名單，直接用你輸入的股號。
# MOPS 彙總報表本來就是全市場的（約 1,975 家），所以非成分股
# 拿到的資料品質與成分股相同。
on:
  workflow_dispatch:
    inputs:
      stock_id:
        description: 股票代號（例如 2330）
        required: true

concurrency:
  # 同一檔連按兩次不需要跑兩遍；不同檔可以並行。
  group: analyse-stock-${{ inputs.stock_id }}
  cancel-in-progress: true

jobs:
  analyse:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安裝相依套件
        run: python -m pip install --quiet -e ".[dev]"

      # 只還原不儲存：每日更新那邊會維護快取，這裡蹭現成的就好。
      # 沒命中也只是慢一點（要重抓十年份彙總報表），不會失敗。
      - name: 還原財報歷史快取
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: mops-history-
          restore-keys: |
            mops-history-

      - name: 分析個股
        id: analyse
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set -o pipefail
          python -m buffett00929.cli analyse "${{ inputs.stock_id }}" 2>&1 | tee analyse.log

      # 摘要直接放進 job summary，不必點進 log 翻。
      - name: 寫入執行摘要
        if: always()
        run: |
          {
            echo "## 個股查詢：${{ inputs.stock_id }}"
            echo
            echo '```'
            cat analyse.log 2>/dev/null || echo "（分析未產生輸出）"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit 報表
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 分析期間分支可能已被推了新的 commit（每日更新會寫產出物）。
          # 直接 push 會被拒，整份結果就白算了。把 HEAD 對齊遠端再重新 commit：
          # 用 --mixed（git reset 的預設）：索引一併對齊遠端，工作目錄裡
          # 剛產生的檔案原封不動。**不可改成 --soft**——那會讓索引停在
          # checkout 當下的舊樹，把執行期間被推上遠端的新檔案記成刪除。
          # 完整理由與兩次實際損失記在 daily-update.yml。
          BRANCH="${{ github.ref_name }}"
          git fetch origin "$BRANCH"
          git reset "origin/$BRANCH"
          git add reports/lookup docs/lookup

          if git diff --cached --quiet; then
            echo "報表沒有變化，不建立 commit。"
            exit 0
          fi

          git commit -m "chore: 個股查詢 ${{ inputs.stock_id }}"

          for attempt in 1 2 3 4; do
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "push 失敗，第 $attempt 次重試"
            sleep $((2 ** attempt))
            git fetch origin "$BRANCH"
            git reset "origin/$BRANCH"
            git add reports/lookup docs/lookup
            git commit -m "chore: 個股查詢 ${{ inputs.stock_id }}"
          done
          exit 1
