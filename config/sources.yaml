# 資料來源設定（對應規格第十九節：優先官方來源）
#
# 優先序：
#   1. MOPS 彙總報表 — 官方，多年度歷史的骨幹（損益、資產負債、營業現金流）
#   2. TWSE / TPEx OpenAPI — 官方，最新一期覆蓋同期數字與市場面資料
#   3. FinMind — 第三方，只補前兩者沒有的細項（資本支出、股利、月營收、PE 序列）
#
# 「官方優先」指的是**同一欄位誰說了算**，不是誰整筆覆蓋誰：
# 合併一律逐欄位進行，來源缺的欄位保留既有值，避免資料反而變少。
# 每個數據點都會記錄實際命中的來源，報表上原樣顯示。

# ---------------------------------------------------------------------------
# 成分股名單來源（依序嘗試，全部失敗則中止，不使用過期資料）
# ---------------------------------------------------------------------------
constituents:
  etf_id: "00929"
  etf_name: "復華台灣科技優息 ETF"
  # 不寫死成分股檔數：以抓取結果為準（公開資料對 40/50 檔說法不一）。
  # 註：證交所**沒有** ETF 成分股 API。已比對其 OpenAPI 全部 143 個端點，
  # `成分`／`PCF`／`申購買回`／`holding`／`composition` 皆 0 筆命中。
  # ETF 持股明細由發行投信自行公告，00929 即復華投信。
  providers:
    - name: fuhwa_official
      enabled: true
      description: >
        復華投信官方持股 API。官網頁面雖為 JS 渲染，但前端呼叫的是純 JSON 端點，
        直接打該端點即可，不需瀏覽器自動化。
      url: "https://www.fhtrust.com.tw/api/assets"
      # 復華內部基金代號。expected_etf_id 用來驗證抓到的確實是 00929——
      # 內部代號若變動，寧可報錯也不要默默分析錯的基金。
      fund_id: "ETF21"
      expected_etf_id: "00929"
      # qDate 為必填且非交易日回空，需往前回溯到最近有資料的日期。
      lookback_days: 10
    - name: manual
      enabled: true
      description: 人工維護的名單，需填 as_of 日期；僅在官方來源失敗時使用
      path: "data/manual/constituents.yaml"
  # 人工名單超過此天數即視為過期並拒絕使用（規格第二節：禁用過時資料）
  manual_max_age_days: 45

# ---------------------------------------------------------------------------
# 證交所 OpenAPI（上市）
# ---------------------------------------------------------------------------
# 注意：實測確認 TWSE OpenAPI 各端點**只回傳最新一期**，不提供歷史查詢。
# 因此它負責「最新一期官方權威值」，多年度歷史由 FinMind 回補。
twse:
  enabled: true
  base_url: "https://openapi.twse.com.tw/v1"
  endpoints:
    monthly_revenue: "/opendata/t187ap05_L"
    income_statement: "/opendata/t187ap06_L_ci"
    balance_sheet: "/opendata/t187ap07_L_ci"
    operating_analysis: "/opendata/t187ap17_L"
    valuation: "/exchangeReport/BWIBBU_ALL"
    daily_price: "/exchangeReport/STOCK_DAY_ALL"
  # 產業別對應不同報表格式；一般業以外的公司需切換端點。
  industry_variants:
    general: "_ci"
    bank: "_bd"
    financial_holding: "_fh"
    insurance: "_ins"
    securities: "_mim"
  # 財報數字單位：TWSE opendata 為新台幣仟元，載入時乘以 1000 轉為元。
  amount_multiplier: 1000

# ---------------------------------------------------------------------------
# 櫃買中心 OpenAPI（上櫃）
# ---------------------------------------------------------------------------
# 00929 追蹤「上市櫃」科技優息指數，成分股包含上櫃公司，故需此來源。
tpex:
  enabled: true
  base_url: "https://www.tpex.org.tw/openapi/v1"
  endpoints:
    monthly_revenue: "/mopsfin_t187ap05_O"
    income_statement: "/mopsfin_t187ap06_O_ci"
    balance_sheet: "/mopsfin_t187ap07_O_ci"
    daily_price: "/tpex_mainboard_daily_close_quotes"
    # 本益比／殖利率／股價淨值比。與證交所的 BWIBBU_ALL 對應，
    # 但**欄位名稱不同**（PriceEarningRatio / YieldRatio / PriceBookRatio），
    # 見 twse.market_data 的別名清單。
    #
    # 探測（2026-08-28，Actions run 33133874411）：櫃買 OpenAPI 規格在
    # /openapi/swagger.json，共 225 個端點；這一個回 887 筆、156 KB，
    # 全市場一次給完，符合整批取用的成本模型。
    # 沒有這一項的期間，所有上櫃公司這三個指標一律標示資料不足。
    valuation: "/tpex_mainboard_peratio_analysis"
  amount_multiplier: 1000

# ---------------------------------------------------------------------------
# 公開資訊觀測站彙總報表（官方、多年度歷史的主要來源）
# ---------------------------------------------------------------------------
# 實測（2026-08-17）：新版 MOPS（mops.twse.com.tw）是 SPA，舊路徑只回轉址殘骸；
# **舊網域 mopsov.twse.com.tw 仍供應彙總報表**，查詢條件由新版前端的
# chunk 定義（/mops/assets/t163sb04.js）反推：TYPEK / year（民國年）/ season。
#
# 一次請求＝該期別全市場（約 1060 家、1.5 MB），因此以期別為單位抓取，
# 不逐檔查詢——逐檔是 50 檔 × 40 期 × 3 表 ≈ 6000 次請求，必定被擋。
mops:
  enabled: true
  base_url: "https://mopsov.twse.com.tw"
  # 年度數抓十年，季度數只抓最近兩年（見 sources/periods.py 的取捨說明）。
  years: 10
  # 回應大且慢（實測 1.7–15.9 秒），逾時要放寬。
  timeout_seconds: 90
  # 連打 6 次未見被擋或降速，仍保留間隔——回補近百次不該貼著上限打。
  min_interval_seconds: 1.0

# ---------------------------------------------------------------------------
# FinMind（補彙總報表沒有的細項）
# ---------------------------------------------------------------------------
# 免費 token 於 https://finmindtrade.com 註冊後取得，設為環境變數 FINMIND_TOKEN。
# MOPS 彙總報表沒有資本支出、股利、月營收與歷史本益比，這些由 FinMind 補；
# **只填空缺，不覆蓋官方數字**。未設定 token 時系統仍可執行，
# 但 FCF、盈再率、殖利率與歷史 PE 分位會標示「資料不足」而非給 0 分。
finmind:
  enabled: true
  base_url: "https://api.finmindtrade.com/api/v4/data"
  token_env: "FINMIND_TOKEN"
  history_years: 10
  datasets:
    stock_info: "TaiwanStockInfo"
    price: "TaiwanStockPrice"
    per: "TaiwanStockPER"
    income_statement: "TaiwanStockFinancialStatements"
    balance_sheet: "TaiwanStockBalanceSheet"
    cash_flow: "TaiwanStockCashFlowsStatement"
    monthly_revenue: "TaiwanStockMonthRevenue"
    dividend: "TaiwanStockDividend"
  # 免費方案有速率限制，請求之間的間隔秒數
  request_interval_seconds: 0.6

# ---------------------------------------------------------------------------
# HTTP 與快取
# ---------------------------------------------------------------------------
http:
  timeout_seconds: 30
  max_retries: 3
  backoff_seconds: [2, 4, 8]
  user_agent: "buffett00929/0.1 (+https://github.com/blair1024-glitch/Indexing)"

cache:
  dir: "data/raw"
  # 當日資料快取有效期。財報事件監控每日執行，故預設 12 小時。
  ttl_hours: 12
  enabled: true

# ---------------------------------------------------------------------------
# 全市場掃描（screen.py）
# ---------------------------------------------------------------------------
screen:
  # 第二階段補齊估值的檔數。FinMind 是逐檔查詢且有速率上限，
  # 每檔 6 次請求（損益、資產負債、現金流、股利、月營收、歷史本益比）。
  #
  # 額度預算：
  #     每日更新（50 檔成分股）           約 300 次
  #     全市場掃描第二階段（top_n: 100）  約 600 次
  # 兩者**無法在同一段額度視窗內共存**。每日排程是平日 10:30 UTC，
  # 掃描要錯開時間，不是靠調低這個值來省。
  #
  # **不要為了省額度調低 top_n。** 實測（2026-08-22）兩檔 BUY 候選
  # 分別排在企業品質第 21 名（聚陽 1477）與第 25 名（達爾膚 6523），
  # top_n 砍到 25 就會幾乎全部漏掉——深度是這個掃描的價值所在。
  #
  # **為什麼不是全市場**：1,975 家全部補齊要 11,850 次請求，以免費方案的
  # 速率算約 40 小時，而 GitHub Actions 單一 job 上限 6 小時——差了近 7 倍，
  # 不是調參數能解決的。而且多數也用不上：BUY 要求總分 ≥ 75，
  # 品質排在後段的公司就算算出安全邊際也不會成為候選。
  #
  # **100 檔已實測可行**（2026-09-03，掃描於 f64a5d5）：600 次請求沒有
  # 觸發速率限制，報表未出現降級橫幅，100 家中 45 家算出安全邊際
  # （45%，門檻 25%）。
  #
  # 這次擴充換到的是什麼，具體地說：BUY 候選由 2 檔變 4 檔，而新增的兩檔
  # **都落在原本看不到的第 51～100 名**——新麥 1580（安全邊際 +42.1%，
  # 比原本的榜首還高）與星通 3025（+23.8%）。top_n=50 時它們不會被估值，
  # 因此不會出現在任何一張名單上。這就是「深度」的實際意義。
  #
  # **再往上加要重新實測**：600 次沒撞牆不代表 900 次也不會。
  # 而且 screen.yml **只還原不儲存快取**，撞牆之後是整次重跑，不是接著補跑。
  #
  # 額度不足時的徵兆：報表最上方會出現「這次執行的估值資料不完整」橫幅
  # （見 screen.ScreenResult.is_degraded）。看到就換個時間重跑，不要連續重試——
  # 連續重試正是 2026-08-22 把額度燒光、50 家裡 48 家估不出價的原因。
  top_n: 100
